baseURL = 'https://martinphysics.club/'
title = 'martinphysics.club'
theme = 'PaperMod'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableRobotsTXT = true

[params]
  env = 'production'
  description = '物理、编程与探索'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true
  disableSpecial1stPost = true
  mainSections = ['post']
  DateFormat = '2006-01-02'

  [params.profileMode]
    enabled = false

  [params.homeInfoParams]
    Title = 'martinphysics.club'
    Content = '物理、编程与探索'

  [params.assets]
    favicon = 'favicon.svg'
    favicon16x16 = 'favicon.svg'
    favicon32x32 = 'favicon.svg'
    apple_touch_icon = 'favicon.svg'
    safari_pinned_tab = 'favicon.svg'

[[menu.main]]
  name = '首页'
  url = '/'
  weight = 1
[[menu.main]]
  name = '文章'
  url = '/posts/'
  weight = 2
[[menu.main]]
  name = '分类与标签'
  url = '/topics/'
  weight = 3
[[menu.main]]
  name = 'RSS'
  url = '/index.xml'
  weight = 4

[markup.highlight]
  noClasses = false
[markup.goldmark.renderer]
  unsafe = false
[pagination]
  pagerSize = 6
[caches.images]
  dir = ':cacheDir/images'
