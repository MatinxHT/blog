baseURL = 'https://martinphysics.club/'
title = 'martinphysics.club'
theme = 'gokarna'
defaultContentLanguage = 'zh-cn'
locale = 'zh-CN'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableRobotsTXT = true

[params]
  description = '物理、编程与探索'
  avatarURL = 'images/avatar.jpg'
  avatarAltText = 'Martin Physics'
  avatarSize = 'size-m'
  footer = 'Martin Physics'
  accentColor = '#287d9b'
  showPostsOnHomePage = 'recent'
  numberPostsOnHomePage = 6
  showBackToTopButton = true
  dateFormat = '2006-01-02'

[[menu.main]]
  name = '首页'
  url = '/'
  weight = 1
[[menu.main]]
  name = '文章'
  url = '/posts/'
  weight = 2
[[menu.main]]
  name = '分类'
  url = '/categories/'
  weight = 3
[[menu.main]]
  name = '标签'
  url = '/tags/'
  weight = 4
[[menu.main]]
  name = 'RSS'
  url = '/index.xml'
  weight = 5

[markup.highlight]
  style = 'monokai'
[markup.goldmark.renderer]
  unsafe = false
[caches.images]
  dir = ':cacheDir/images'
