{{ with index hugo.Data.archived_comments .Page.Slug }}
<section class="archived-comments" aria-labelledby="archived-comments-title">
    <h2 id="archived-comments-title">历史评论（{{ len . }}）</h2>
    <p class="archived-comments-note">以下评论来自原 WordPress 站点，按原文保留。</p>
    <ol class="archived-comments-list">
        {{ range . }}
        <li class="archived-comment" id="comment-{{ .id }}">
            <div class="archived-comment-meta">
                <strong>{{ .author }}</strong>
                <time datetime="{{ .date }}">{{ dateFormat "2006-01-02 15:04" .date }} UTC</time>
            </div>
            <p>{{ .content }}</p>
        </li>
        {{ end }}
    </ol>
</section>
{{ end }}
